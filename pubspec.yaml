name: bedal
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  video_player: ^2.13.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  device_info_plus: ^13.2.0
  crypto: ^3.0.3
  flutter_svg: ^2.3.0
  camera: ^0.12.0+2
  provider: ^6.1.5+1
  geolocator: ^14.1.1
  geocoding: ^5.0.0
  firebase_core: 3.10.0
  cloud_firestore: 5.6.0
  firebase_auth: 5.3.3
  firebase_storage: 12.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo/
    - assets/images/onboarding/
    - assets/images/auth_background/
    - assets/images/character_images/
    - assets/videos/home_sample.mp4
    - assets/images/profile/
    - assets/images/profile/background_profile/
    - assets/images/profile/character_profile/
    - assets/images/profile/character_profile/female_characters/
    - assets/images/profile/character_profile/male_characters/

flutter_native_splash:
  background_image: "assets/images/onboarding/splash_screen.png"
  fullscreen: true
  color: "#f5ece1"

  android_12:
    background_image: "assets/images/onboarding/splash_screen.png"
    color: "#f5ece1"
